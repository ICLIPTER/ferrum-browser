[package]
name = "ferrum-browser"
version = "0.1.0"
edition = "2024"
description = "Ferrum Browser — a desktop browser written in Rust"
license = "MIT"

[dependencies]
# Only the lighter glow (OpenGL) backend: faster builds, no wgpu stack.
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
url = "2.5.8"

[profile.release]
opt-level = 2
